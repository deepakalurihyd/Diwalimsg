.hot:hover,.hot:focus-visible{background:#ffd45a2b;border-color:#ffe08caa}.fx-layer{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}.fx{position:absolute;pointer-events:none;opacity:0;transition:opacity .28s ease,filter .28s ease}.fx.active{opacity:1}#diyaFx{left:53%;top:7%;width:25%;height:16%;border-radius:50%;background:radial-gradient(ellipse,#ffdc6f55 0, #ffae2540 28%,transparent 72%);mix-blend-mode:screen}#cinemaFx{left:11.5%;top:30.2%;width:15.8%;height:11.3%;display:grid;place-items:center;padding:4px;text-align:center;color:#ffe78a;background:linear-gradient(135deg,#12081be8,#360c29de);border:1px solid #ffc860;border-radius:6px;font:bold clamp(8px,1.05vw,15px)/1.1 Arial,sans-serif;text-shadow:0 0 8px #ffb938;box-shadow:0 0 18px #ffb93880}#houseFx{left:53%;top:25%;width:30%;height:22%;display:grid;place-items:end center;padding:10px;text-align:center;color:#fff4c4;background:linear-gradient(0deg,#090414c9,transparent 68%),radial-gradient(ellipse at 50% 72%,#ffd45a55,transparent 74%);border-radius:12px;text-shadow:0 2px 5px #000;font:bold clamp(9px,1.1vw,15px) Arial,sans-serif}#lightFx{left:1%;top:59%;width:39%;height:22%;border-radius:16px;background:radial-gradient(ellipse at 65% 45%,#ffbb34aa,transparent 65%);mix-blend-mode:screen;filter:saturate(1.4);display:grid;place-items:center;color:#fff7c8;font:bold clamp(9px,1.2vw,17px) Arial,sans-serif;text-shadow:0 0 10px #ffca48}.led-fx{display:none;position:absolute;place-items:center;overflow:hidden;text-align:center;padding:3px;color:#fff59a;background:#080817c9;border:1px solid #ffe276;border-radius:3px;font:bold clamp(7px,1.1vw,16px)/1.05 Georgia,serif;text-shadow:0 0 7px #ffe34e,0 0 14px #ffc735;box-shadow:0 0 12px #ffd04588}.led-fx.show{display:grid}#ledIndoor{left:51.5%;top:61.7%;width:13.2%;height:9.5%}#ledStandee{left:72.2%;top:63.8%;width:4.3%;height:11.3%;font-size:clamp(6px,.62vw,10px);overflow-wrap:anywhere}#ledOutdoor{left:86.1%;top:60.3%;width:12.7%;height:11.4%}.status{position:relative;left:auto;bottom:auto;margin:12px auto 0;max-width:min(90vw,540px);text-align:center}.editor{position:relative;right:auto;bottom:auto;margin:10px auto 18px;width:min(640px,calc(100% - 24px))}.hint{line-height:1.35}.led-input-hit{position:absolute;z-index:5;pointer-events:auto;box-sizing:border-box;padding:0 8px;background:#23102bdc;border:1px solid #f2bd4b;border-radius:5px;color:#ffe8a2;font:clamp(8px,1.05vw,15px) Arial,sans-serif;outline:none}.led-input-hit:focus{box-shadow:0 0 0 2px #ffe18b,0 0 15px #ffc950}.led-update-hit{position:absolute;z-index:5;pointer-events:auto;border:1px solid transparent;background:transparent;border-radius:8px;cursor:pointer}.led-update-hit:hover,.led-update-hit:focus-visible{background:#ffd45a35;border-color:#ffe08c;outline:2px solid #ffe08c}.selected-led{filter:drop-shadow(0 0 10px #ffd850)}#cinemaFx{display:block;padding:0;overflow:hidden;border-radius:5px;background:#100b22;border:1px solid #ffd16a;box-shadow:0 0 20px #ffad3f99}#cinemaFx .cinema-art{position:absolute;inset:0;background:#130c24;transition:background .35s}.cinema-copy{position:absolute;inset:0;display:grid;place-items:center;padding:5px;text-align:center;color:#fff2a3;font:bold clamp(7px,1vw,14px)/1.1 Arial,sans-serif;text-shadow:0 0 8px #ffc64a;opacity:0}.cinema-copy.visible{opacity:1}#cinemaFx[data-mode="show"] .cinema-art{background:radial-gradient(circle at 21% 28%,#fff 0 1px,transparent 3px),radial-gradient(circle at 79% 23%,#ffe9a0 0 1px,transparent 3px),radial-gradient(ellipse at 50% 110%,#ffc44e 0 7%,#c04f73 8% 19%,transparent 20%),linear-gradient(180deg,#0c1648,#5f237d 57%,#e78c48)}#cinemaFx[data-mode="show"] .cinema-art:before{content:"✦　 ✧　 ✦";position:absolute;inset:8% 0 auto;text-align:center;color:#fff3b1;font-size:clamp(9px,1.5vw,20px);text-shadow:0 0 12px #ffd24d;animation:cinemaSpark 1.4s ease-in-out infinite alternate}#cinemaFx[data-mode="intermission"] .cinema-art{background:linear-gradient(90deg,#160620 0 14%,#71334d 20%,#180c2d 50%,#71334d 80%,#160620 86%)}#cinemaFx[data-mode="intermission"] .cinema-copy{color:#ffe29a;font-family:Georgia,serif;letter-spacing:.14em}#cinemaFx[data-mode="credits"] .cinema-art{background:linear-gradient(#05040b,#19142d)}#cinemaFx[data-mode="credits"] .cinema-copy{display:block;padding-top:70%;animation:creditRoll 9s linear infinite;font:600 clamp(7px,.9vw,13px)/1.8 Georgia,serif;white-space:pre-line}#houseFx{display:block;overflow:hidden;border-radius:10px;background:transparent!important;text-shadow:none}#houseFx .home-window{position:absolute;display:block;opacity:0;border-radius:4px;transition:opacity .35s,filter .35s;filter:blur(1px);box-shadow:0 0 16px currentColor}.w1{left:57%;top:23%;width:24%;height:23%}.w2{left:82%;top:23%;width:15%;height:23%}.w3{left:56%;top:51%;width:28%;height:22%}.w4{left:84%;top:50%;width:13%;height:22%}.w5{left:21%;top:74%;width:25%;height:7%;border-radius:50%!important}#houseFx[data-mode="welcome"] .w1,#houseFx[data-mode="welcome"] .w3{opacity:.72;color:#ffdc82;background:#ffca5a88}#houseFx[data-mode="diwali"] .home-window{opacity:.8;color:#ffb539;background:#ffab3899;filter:blur(1px)}#houseFx[data-mode="party"] .w1,#houseFx[data-mode="party"] .w3,#houseFx[data-mode="party"] .w5{opacity:.86;color:#ff64f3;background:#cf46ff99}#houseFx[data-mode="party"] .w2,#houseFx[data-mode="party"] .w4{opacity:.86;color:#62dfff;background:#46c9ff99}#houseFx[data-mode="relax"] .w1,#houseFx[data-mode="relax"] .w3{opacity:.46;color:#9ed9ff;background:#81cfff88}#houseFx[data-mode="relax"] .w2,#houseFx[data-mode="relax"] .w4{opacity:.2;color:#dff4ff;background:#dff4ff55}.house-label{position:absolute;left:2%;bottom:3%;padding:4px 6px;border-radius:4px;background:#100918c9;color:#fff2c8;font:bold clamp(7px,.85vw,12px) Arial,sans-serif;text-shadow:0 1px 3px #000}.led-input-hit{font-weight:500}.led-fx{z-index:3}@keyframes cinemaSpark{to{transform:scale(1.12);opacity:.65}}@keyframes creditRoll{from{transform:translateY(30%)}to{transform:translateY(-90%)}}#stage:fullscreen{position:fixed;inset:0;margin:auto;width:min(100vw,150vh);height:auto;aspect-ratio:3/2;max-width:100vw;max-height:100vh;background:#13091d;overflow:hidden}#stage:fullscreen .art{width:100%;height:100%;object-fit:contain}#stage:fullscreen .layer,#stage:fullscreen .fx-layer{inset:0;width:100%;height:100%}#diyaFx{left:37%;top:7.5%;width:20%;height:14%;background:radial-gradient(ellipse at 50% 64%,#fff2a07a 0,#ffc23e66 35%,#ff8c2c33 56%,transparent 78%);filter:drop-shadow(0 0 14px #ffbf3e);mix-blend-mode:screen}#diyaFx:before{content:"";position:absolute;left:44%;top:8%;width:12%;height:34%;border-radius:75% 15% 65% 35%;transform:rotate(45deg);background:radial-gradient(ellipse at 35% 72%,#fffbd0 0 13%,#ffe36a 36%,#ff9a25 65%,transparent 72%);filter:drop-shadow(0 0 11px #ffd34a)}.diya-spark{animation:diyaPulse 1.4s ease-in-out infinite alternate}@keyframes diyaPulse{to{opacity:.66;filter:drop-shadow(0 0 28px #ffd95a)}}.site-footer{max-width:1536px;margin:18px auto 24px;padding:18px 14px;border-top:1px solid #e8b34c66;color:#ead7eb;text-align:center;font:13px/1.5 Arial,sans-serif;letter-spacing:.05em}.site-footer strong{color:#ffe18a;letter-spacing:.14em}.site-footer .sep{color:#e8b34c;padding:0 9px}.firework{display:none;position:absolute;width:34%;aspect-ratio:1;border-radius:50%;opacity:0;--burst:#ffd86a;filter:drop-shadow(0 0 6px var(--burst));animation:fireworkBurst 1.8s ease-out infinite}.firework:before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,var(--burst) 0deg 2deg,transparent 3deg 18deg);mask:radial-gradient(circle,transparent 0 13%,#000 20% 53%,transparent 67%)}.firework:after{content:"";position:absolute;left:43%;top:43%;width:14%;height:14%;border-radius:50%;background:#fff7c8;box-shadow:0 0 8px var(--burst)}.f1{left:5%;top:4%;--burst:#ffd46b}.f2{left:48%;top:-7%;width:29%;animation-delay:.55s;--burst:#ff74d5}.f3{right:1%;bottom:-12%;width:30%;animation-delay:1.05s;--burst:#8df6ff}#cinemaFx[data-mode="show"] .firework{display:block}@keyframes fireworkBurst{0%{transform:scale(.12);opacity:0}12%{opacity:1}72%{opacity:.85}100%{transform:scale(1.18);opacity:0}}.led-fx{background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;padding:0!important;color:#fff49a!important;font-family:Arial,sans-serif!important;font-weight:700!important;letter-spacing:.015em;text-shadow:0 0 3px #fff8bd,0 0 8px #ffd84c,0 0 15px #ffac23!important;filter:none!important;isolation:isolate}.led-fx:before{content:"";position:absolute;z-index:0;inset:2% 0;border-radius:50%;background:radial-gradient(ellipse at center,#210b38 0 62%,rgba(33,11,56,.99) 77%,rgba(33,11,56,.92) 90%,transparent 100%);filter:blur(2px);pointer-events:none}.led-message{position:relative;z-index:1;display:block;max-width:100%;overflow-wrap:anywhere;font-size:clamp(10px,1.3vw,20px);line-height:1.02;text-align:center}#ledStandee .led-message{font-size:clamp(6px,.62vw,10px)}#cinemaFx{border:0!important;box-shadow:none!important;border-radius:0!important;background:transparent!important}#cinemaFx .cinema-copy{border:0;background:linear-gradient(transparent 48%,#170b2870);box-shadow:none;text-shadow:0 0 4px #fff3af,0 0 9px #ffb42f}.led-input-hit{background:#241136!important;border:0!important;border-radius:0!important;box-shadow:none!important;color:#fff0a0;text-shadow:0 0 4px #ffe98a}.led-input-hit:focus{outline:1px solid #ffe08c66;box-shadow:none}/* Greetings are rendered directly on the cleaned LED artwork; no card or mask. */
.led-fx{display:none;position:absolute;z-index:3;place-items:center;overflow:hidden;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;background:transparent!important;color:#fff49a!important;font:700 clamp(8px,1.05vw,15px)/1.02 Arial,sans-serif!important;letter-spacing:0!important;text-align:center;text-shadow:0 0 3px #fff8bd,0 0 8px #ffd84c,0 0 15px #ffac23!important;isolation:auto!important}
.led-fx.show{display:grid}.led-fx:before{content:none!important}
.led-message{position:relative;display:block;width:100%;max-width:100%;max-height:100%;padding:0 1px;white-space:normal;overflow:hidden;overflow-wrap:break-word;word-break:normal;font-family:Arial,sans-serif;font-weight:700;line-height:1.02;text-align:center}
#ledIndoor{left:55.8%;top:64.2%;width:7.3%;height:5.8%}
#ledStandee{left:72.2%;top:67.5%;width:3.3%;height:4.8%}

.led-input-hit{background:#261334!important;color:#fff0a0!important}</style></head><body>
<div class="wrap" id="stage"><img class="art" id="reference" alt="ARNI INNOVATIONS Diwali greeting reference design" src="arni-diwali-reference.png">
<div class="layer" aria-label="Interactive controls">
<!-- Coordinates correspond to elements in the exact reference artwork. -->
<button class="hot" style="left:39%;top:9%;width:15.5%;height:9.5%" onclick="diya()" aria-label="Light the diya"></button>
<button class="hot" style="left:55%;top:10.3%;width:18%;height:5.7%" onclick="diya()" aria-label="Tap to light the diya"></button>
<button class="hot" style="left:37.5%;top:26.3%;width:10.8%;height:3.6%" onclick="cinema('Start the Show')" aria-label="Start the show"></button>
<button class="hot" style="left:37.5%;top:30.8%;width:10.8%;height:3.2%" onclick="cinema('Intermission')" aria-label="Intermission"></button>
<button class="hot" style="left:37.5%;top:34.6%;width:10.8%;height:3.2%" onclick="cinema('End Titles')" aria-label="End titles"></button>
<button class="hot" style="left:37.5%;top:38.4%;width:10.8%;height:3.2%" onclick="cinema('Full Screen')" aria-label="Fullscreen"></button>
<button class="hot" style="left:37.5%;top:42.3%;width:10.8%;height:4.1%" onclick="sound()" aria-label="Toggle sound"></button>
<button class="hot" style="left:85%;top:28.4%;width:13%;height:3.6%" onclick="house('Welcome Home')" aria-label="Welcome home scene"></button>
<button class="hot" style="left:85%;top:32.2%;width:13%;height:3.6%" onclick="house('Diwali Celebration')" aria-label="Diwali celebration scene"></button>
<button class="hot" style="left:85%;top:36%;width:13%;height:3.6%" onclick="house('Party Mode')" aria-label="Party mode scene"></button>
<button class="hot" style="left:85%;top:39.6%;width:13%;height:3.6%" onclick="house('Relax Mode')" aria-label="Relax mode scene"></button>
<button class="hot" style="left:85%;top:44.1%;width:13%;height:4.4%" onclick="runScene()" aria-label="Run selected HIVEX scene"></button>
<button class="hot" style="left:36%;top:61.2%;width:11.2%;height:3.6%" onclick="lighting('Warm Gold')" aria-label="Warm gold lighting"></button>
<button class="hot" style="left:36%;top:64.9%;width:11.2%;height:3.6%" onclick="lighting('Elegant White')" aria-label="Elegant white lighting"></button>
<button class="hot" style="left:36%;top:68.7%;width:11.2%;height:3.6%" onclick="lighting('Festive RGB')" aria-label="Festive RGB lighting"></button>
<button class="hot" style="left:36%;top:72.5%;width:11.2%;height:3.6%" onclick="lighting('Dynamic Wave')" aria-label="Dynamic wave lighting"></button>
<button class="hot" style="left:36%;top:77.2%;width:11.2%;height:4.2%" onclick="applyLighting()" aria-label="Apply selected ARIOX lighting"></button>
<button class="hot" style="left:85%;top:91%;width:13%;height:6%" onclick="share()" aria-label="Share on WhatsApp"></button>
<input class="led-input-hit" id="greeting" aria-label="Custom greeting for all LED screens" maxlength="90" value="" style="left:63.8%;top:80.3%;width:20.7%;height:4.2%">
<button class="led-update-hit" onclick="applyGreeting()" aria-label="Update all LED screens" style="left:85%;top:80%;width:13.2%;height:5.1%"></button>
</div><div class="fx-layer" aria-hidden="true"><div id="diyaFx" class="fx"></div><div id="cinemaFx" class="fx"><div class="cinema-art"><i class="firework f1"></i><i class="firework f2"></i><i class="firework f3"></i></div><div id="cinemaCopy" class="cinema-copy"></div></div><div id="houseFx" class="fx"><i class="home-window w1"></i><i class="home-window w2"></i><i class="home-window w3"></i><i class="home-window w4"></i><i class="home-window w5"></i><b id="houseLabel" class="house-label"></b></div><div id="lightFx" class="fx"></div><div id="ledIndoor" class="led-fx"><span class="led-message"></span></div><div id="ledStandee" class="led-fx"><span class="led-message"></span></div><div id="ledOutdoor" class="led-fx"><span class="led-message"></span></div></div></div>
<div class="status" id="status" role="status">Tap the diya or any highlighted control area to interact with the design.</div>
<footer class="site-footer"><strong>ARNI INNOVATIONS</strong><span class="sep">•</span>Deepak Aluri<span class="sep">•</span>Home automation &amp; Home cinema experiences&amp; Led lighting &amp; Led Indoor & Outdoor Screens</footer>
<script>
let lit=false,soundOn=true,greeting='Happy Diwali!',selectedHouse='',selectedLight='';const status=document.getElementById('status');const fx=id=>document.getElementById(id);function say(s){status.textContent=s}
function diya(){lit=!lit;const glow=fx('diyaFx');glow.classList.toggle('active',lit);glow.classList.toggle('diya-spark',lit);say(lit?'Diya lit — Happy Diwali! ✨':'Diya is switched off.');}
function cinema(s){if(s==='Full Screen'){const el=document.getElementById('stage');if(document.fullscreenElement){document.exitFullscreen();say('Full screen closed.');}else if(el.requestFullscreen){el.requestFullscreen();say('Cinema preview opened in fullscreen.');}return}const screen=fx('cinemaFx'),copy=fx('cinemaCopy');screen.dataset.mode=s==='Start the Show'?'show':s==='Intermission'?'intermission':'credits';copy.textContent=s==='Start the Show'?'HAPPY DIWALI · PREMIERE':s==='Intermission'?'INTERMISSION':'ARNI INNOVATIONS\nTHANK YOU FOR WATCHING\nHAPPY DIWALI';copy.classList.add('visible');screen.classList.add('active');say('CINEMAPLEX scene changed: '+s+'.');}
function sound(){soundOn=!soundOn;say('Cinema sound '+(soundOn?'ON':'OFF')+'. (Sound control preview)');}
function house(s){selectedHouse=s;const panel=fx('houseFx'),key={'Welcome Home':'welcome','Diwali Celebration':'diwali','Party Mode':'party','Relax Mode':'relax'}[s]||'welcome';panel.dataset.mode=key;fx('houseLabel').textContent=s.toUpperCase();panel.classList.add('active');say('HIVEX home preview changed: '+s+'. Window lighting is updated.');}
function runScene(){if(!selectedHouse)house('Welcome Home');fx('houseLabel').textContent='SCENE ON · '+selectedHouse.toUpperCase();say('HIVEX scene running: '+selectedHouse+'.');}
function lighting(s){selectedLight=s;const panel=fx('lightFx');const colors={'Warm Gold':'#ffbd3988','Elegant White':'#e3f6ff99','Festive RGB':'#e24dff99','Dynamic Wave':'#3ce5d399'};panel.style.background='radial-gradient(ellipse at 65% 45%,'+(colors[s]||colors['Warm Gold'])+',transparent 68%)';panel.textContent=s.toUpperCase();panel.classList.add('active');say('ARIOX lighting preview: '+s+'. Click Apply Lighting to confirm the façade scene.');}
function applyLighting(){if(!selectedLight){selectedLight='Warm Gold';lighting(selectedLight)}fx('lightFx').textContent='ARIOX · '+selectedLight.toUpperCase();say('ARIOX lighting applied: '+selectedLight+'.');}
function fitGreeting(){['ledIndoor','ledStandee','ledOutdoor'].forEach(id=>{const box=fx(id),msg=box.querySelector('.led-message');let size=Math.min(id==='ledStandee'?9:15,box.clientHeight*(id==='ledStandee'?0.2:0.28));msg.style.fontSize=size+'px';while(size>5&&(msg.scrollWidth>box.clientWidth||msg.scrollHeight>box.clientHeight)){size-=0.5;msg.style.fontSize=size+'px';}})}
function applyGreeting(){greeting=fx('greeting').value.trim()||'Happy Diwali!';['ledIndoor','ledStandee','ledOutdoor'].forEach(id=>{const e=fx(id);e.querySelector('.led-message').textContent=greeting;e.classList.add('show')});requestAnimationFrame(fitGreeting);say('LED greeting replaced on Indoor Wall, Standee and Outdoor Screen: “'+greeting+'”.');}
window.addEventListener('resize',()=>{if(fx('ledIndoor').classList.contains('show'))fitGreeting()});
function share(){const text=encodeURIComponent('Wishing you a bright and beautiful Diwali! — ARNI INNOVATIONS');window.open('https://wa.me/?text='+text,'_blank');}
</script></body></html>
